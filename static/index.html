<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>多语言背单词</title>
<!-- PWA 支持 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4a90d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* ===== 全局重置与变量 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4a90d9;
  --primary-light:#e8f2fc;
  --accent:#f5a623;
  --danger:#e74c3c;
  --success:#27ae60;
  --bg:#f4f6f9;
  --card:#fff;
  --text:#2c3e50;
  --text-light:#7f8c8d;
  --border:#e0e4e8;
  --radius:14px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select{font-family:inherit;outline:none}

/* ===== 布局 ===== */
.app{max-width:480px;margin:0 auto;padding:16px 16px 80px;min-height:100vh;position:relative}
@media(min-width:768px){.app{max-width:560px;padding:24px 24px 90px}}

/* ===== 顶栏 ===== */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header h1{font-size:20px;font-weight:700;color:var(--primary)}
.header .right-actions{display:flex;align-items:center;gap:8px}
.header .gear{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .2s}
.header .gear:active{transform:rotate(90deg)}

/* 语言选择器 */
.lang-switcher{position:relative}
.lang-switcher .lang-btn{padding:6px 12px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:4px;transition:background .2s}
.lang-switcher .lang-btn:active{background:var(--primary-light)}
.lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:6px 0;min-width:160px;z-index:150;display:none}
.lang-dropdown.show{display:block}
.lang-dropdown .lang-option{display:block;width:100%;padding:10px 16px;text-align:left;font-size:14px;color:var(--text);background:none;transition:background .15s}
.lang-dropdown .lang-option:active,.lang-dropdown .lang-option:hover{background:var(--primary-light)}
.lang-dropdown .lang-option.active{color:var(--primary);font-weight:600}
.lang-dropdown .lang-divider{height:1px;background:var(--border);margin:4px 0}

/* ===== Tab 底栏 ===== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
.tab-bar button{flex:1;padding:10px 0 6px;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-light);transition:color .2s}
.tab-bar button.active{color:var(--primary);font-weight:600}
.tab-bar button .icon{font-size:20px}

/* ===== Section 通用 ===== */
section{display:none}
section.active{display:block}

/* ===== 模式切换条 ===== */
.mode-bar,.sub-tabs,.view-toggles{display:flex;gap:8px;margin-bottom:14px}
.mode-bar button,.sub-tabs button,.view-toggles button{flex:1;padding:10px 6px;border-radius:10px;background:var(--card);border:2px solid var(--border);font-size:13px;font-weight:600;transition:all .2s}
.mode-bar button.active,.sub-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.view-toggles button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-toggles button.inactive{background:var(--card);color:#999;border-color:var(--border);text-decoration:line-through}

/* ===== 卡片 ===== */
.quiz-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;transition:transform .15s;position:relative}
.quiz-edit-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--primary);font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:transform .1s}
.quiz-edit-btn:active{transform:scale(.9)}
.quiz-card .question{font-size:26px;font-weight:700;margin-bottom:8px;word-break:break-word}
.quiz-card .hint{font-size:14px;color:var(--text-light)}
.quiz-card .answer{font-size:22px;font-weight:600;color:var(--primary);margin-top:16px;opacity:0;transition:opacity .3s}
.quiz-card .answer.show{opacity:1}
.reveal-btn{width:100%;padding:14px;border-radius:10px;background:var(--primary-light);color:var(--primary);font-size:15px;font-weight:600;margin-bottom:12px;transition:background .2s}
.reveal-btn:active{background:#d0e4f7}

/* 操作按钮行 */
.action-row{display:flex;gap:10px;margin-bottom:16px}
.action-row button{flex:1;padding:14px 8px;border-radius:10px;font-size:14px;font-weight:700;color:#fff;transition:transform .1s}
.action-row button:active{transform:scale(.95)}
.btn-remember{background:var(--success)}
.btn-favorite{background:var(--accent)}
.btn-kill{background:var(--danger)}

.start-btn,.batch-btn{width:100%;padding:16px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;transition:transform .1s}
.start-btn:active,.batch-btn:active{transform:scale(.97)}
.start-btn:disabled,.batch-btn:disabled{opacity:.5;cursor:not-allowed}

.done-msg{text-align:center;padding:40px 20px;color:var(--text-light);font-size:15px}
.done-msg button{margin-top:16px}

/* ===== 单词列表 ===== */
.word-list{display:flex;flex-direction:column;gap:8px}
.word-item{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.word-item .col-zh{flex:1;font-size:14px;min-width:0}
.word-item .col-en{flex:1;font-size:13px;color:var(--text-light);min-width:0}
.word-item .col-term{flex:1;font-size:14px;font-weight:600;color:var(--primary);min-width:0}
/* 遮罩 */
.word-item .masked{background:var(--border);border-radius:4px;color:transparent;user-select:none;cursor:pointer;transition:background .2s,color .2s;padding:2px 4px}
.word-item .masked.revealed{background:transparent;color:inherit}
.word-item .restore-btn{padding:6px 10px;border-radius:8px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:600;white-space:nowrap}
/* 行内操作图标按钮 */
.word-item .actions{display:flex;gap:4px;flex-shrink:0}
.word-item .icon-btn{min-width:30px;height:30px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;white-space:nowrap;transition:transform .1s,background .15s}
.word-item .icon-btn:active{transform:scale(.88)}
.word-item .icon-btn.fav{color:var(--accent)}
.word-item .icon-btn.fav.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.word-item .icon-btn.kill{color:var(--danger)}
.word-item .icon-btn.edit{color:var(--primary)}
.word-item .icon-btn.restore{color:var(--primary);font-size:12px;font-weight:600;padding:0 8px}
.word-item .icon-btn.save{background:var(--success);color:#fff;border-color:var(--success);font-size:12px;font-weight:600;padding:0 10px}
.word-item .icon-btn.cancel{font-size:12px;padding:0 10px;color:var(--text-light)}
/* 行内编辑态 */
.word-item.editing{flex-wrap:wrap}
.word-item .edit-fields{display:flex;flex:1;gap:6px;flex-wrap:wrap;min-width:0}
.word-item .edit-inp{flex:1;min-width:70px;padding:8px 6px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.word-item .edit-actions{display:flex;gap:4px;flex-shrink:0}
/* 抽查卡片编辑弹层字段 */
.qe-label{display:block;font-size:12px;color:var(--text-light);font-weight:600;margin:10px 0 4px}
.qe-inp{width:100%;padding:11px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg)}

/* 分页 */
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--text-light)}
.pagination button{padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:13px}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* ===== 上传 ===== */
.upload-area{background:var(--card);border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:border-color .2s}
.upload-area:active{border-color:var(--primary)}
.upload-area .icon{font-size:36px;margin-bottom:8px}
.upload-area p{font-size:14px;color:var(--text-light)}
.upload-area input{display:none}
.spinner{display:none;text-align:center;padding:20px;font-size:14px;color:var(--text-light)}
.spinner.show{display:block}

/* 手动录入区 */
.manual-entry{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.manual-entry h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.manual-entry .inputs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.manual-entry .inputs input{flex:1;min-width:80px;padding:10px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.manual-entry .add-btn{width:100%;padding:10px;border-radius:8px;background:var(--success);color:#fff;font-size:13px;font-weight:600;transition:transform .1s}
.manual-entry .add-btn:active{transform:scale(.97)}

/* Excel/图片上传按钮 */
.upload-row{display:flex;gap:10px;margin-bottom:16px}
.upload-row .upload-box{flex:1;background:var(--card);border:2px dashed var(--border);border-radius:var(--radius);padding:24px 12px;text-align:center;cursor:pointer;transition:border-color .2s}
.upload-row .upload-box:active{border-color:var(--primary)}
.upload-row .upload-box.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.upload-row .upload-box .icon{font-size:28px;margin-bottom:4px}
.upload-row .upload-box p{font-size:12px;color:var(--text-light)}

/* 可编辑表格 */
.edit-table{width:100%;border-collapse:separate;border-spacing:0 6px;margin-bottom:14px}
.edit-table th{font-size:12px;color:var(--text-light);text-align:left;padding:0 6px 4px}
.edit-table td{padding:0 4px}
.edit-table input{width:100%;padding:10px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.edit-table .del-btn{width:32px;height:32px;border-radius:8px;background:var(--danger);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}

/* ===== 设置弹层 ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px 20px 32px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h2 .close{font-size:22px;color:var(--text-light);background:none;padding:4px}
.modal label{display:block;font-size:13px;font-weight:600;color:var(--text-light);margin:12px 0 4px}
.modal select,.modal input[type=password],.modal input[type=number],.modal input[type=url],.modal input[type=text]{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg)}
.modal .save-btn{width:100%;padding:14px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;margin-top:18px}
.modal .backup-row{display:flex;gap:10px;margin-top:14px}
.modal .backup-row button{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--border)}
.modal .hint-text{font-size:12px;color:var(--text-light);margin-top:4px}
.apikey-link{display:inline-block;font-size:12px;font-weight:600;color:var(--primary);margin-top:6px;text-decoration:none}
.apikey-link:hover{text-decoration:underline}

/* ===== 提示横幅 ===== */
.banner{background:var(--primary-light);border:1px solid var(--primary);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--primary);display:none}
.banner.show{display:block}

/* ===== 数据同步区域 ===== */
.sync-section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-top:18px}
.sync-section h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sync-btns{display:flex;gap:10px;margin-bottom:8px}
.sync-btns button{flex:1;padding:13px 10px;border-radius:10px;font-size:14px;font-weight:600;transition:transform .1s}
.sync-btns button:active{transform:scale(.96)}
.sync-btns .btn-export,.sync-btns .btn-import{background:#eef2f8;color:#46566e;border:1px solid #d5dded}
.sync-btns button:hover{background:#e2e9f4}
.sync-hint{font-size:11px;color:var(--text-light);text-align:center}
/* 确认弹窗 */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px 20px;max-width:320px;width:90%;text-align:center;animation:slideUp .2s ease}
.confirm-box p{font-size:14px;color:var(--text);margin-bottom:18px;line-height:1.6}
.confirm-box .confirm-btns{display:flex;gap:10px}
.confirm-box .confirm-btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600}
.confirm-box .btn-yes{background:var(--primary);color:#fff}
.confirm-box .btn-no{background:var(--bg);border:1px solid var(--border);color:var(--text)}

/* ===== Toast ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <div class="header">
    <h1>📖 <span id="app-title">背单词</span></h1>
    <div class="right-actions">
      <div class="lang-switcher">
        <button class="lang-btn" id="lang-btn" onclick="toggleLangDropdown()"><span id="lang-label">西班牙语</span> ▾</button>
        <div class="lang-dropdown" id="lang-dropdown"></div>
      </div>
      <button class="gear" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <!-- 添加到主屏幕提示 -->
  <div class="banner" id="pwa-banner">💡 建议"添加到主屏幕"以确保数据安全且获得最佳体验</div>

  <!-- ===== 页面1：抽查 ===== -->
  <section id="sec-quiz" class="active">
    <div class="mode-bar" id="quiz-mode-bar">
      <button class="active" onclick="setQuizMode('meaning2term')">释义 → 目标词</button>
      <button onclick="setQuizMode('term2meaning')">目标词 → 释义</button>
    </div>
    <div id="quiz-body">
      <button class="start-btn" onclick="startQuiz()">开始抽查</button>
    </div>
  </section>

  <!-- ===== 页面2：列表 ===== -->
  <section id="sec-list">
    <div class="sub-tabs">
      <button class="active" onclick="setListView('all')">单词本</button>
      <button onclick="setListView('favorites')">收藏夹</button>
      <button onclick="setListView('killed')">已斩</button>
    </div>
    <div class="view-toggles" id="view-toggles">
      <button class="active" id="toggle-zh" onclick="toggleLangCol('zh')">中文</button>
      <button class="active" id="toggle-en" onclick="toggleLangCol('en')">英文</button>
      <button class="active" id="toggle-term" onclick="toggleLangCol('term')">目标词</button>
    </div>
    <div id="list-body" class="word-list"></div>
    <div id="list-pagination" class="pagination"></div>
    <!-- 数据同步区域 -->
    <div class="sync-section">
      <h3>🔄 数据同步</h3>
      <div class="sync-btns">
        <button class="btn-export" onclick="exportBackup()">📤 导出数据</button>
        <button class="btn-import" onclick="document.getElementById('sync-import').click()">📥 导入更新</button>
      </div>
      <p class="sync-hint">换设备时：旧设备导出 → 新设备导入，数据自动合并</p>
      <input type="file" id="sync-import" accept=".json,application/json" hidden onchange="importBackup(event)">
    </div>
  </section>

  <!-- ===== 页面3：上传 ===== -->
  <section id="sec-upload">
    <!-- 手动录入区域 -->
    <div class="manual-entry">
      <h3>✏️ 手动录入</h3>
      <div class="inputs" id="manual-inputs">
        <input type="text" id="manual-term" placeholder="目标词（必填）">
        <input type="text" id="manual-en" placeholder="英文（选填）">
        <input type="text" id="manual-zh" placeholder="中文（选填）">
      </div>
      <button class="add-btn" onclick="addManualWord()">＋ 添加到待确认列表</button>
    </div>
    <!-- 图片/CSV 上传区 -->
    <div class="upload-row">
      <div class="upload-box" id="ocr-box" onclick="triggerOCR()">
        <div class="icon">📷</div>
        <p>选择图片 / 拍照</p>
        <input type="file" id="file-input" accept="image/*" onchange="handleUpload(event)" style="display:none">
      </div>
      <div class="upload-box" onclick="document.getElementById('csv-input').click()">
        <div class="icon">📊</div>
        <p>上传 CSV</p>
        <input type="file" id="csv-input" accept=".csv,.txt" onchange="handleCSVUpload(event)" style="display:none">
      </div>
    </div>
    <div id="upload-spinner" class="spinner">⏳ 正在识别中，请稍候...</div>
    <div id="upload-result"></div>
  </section>
</div>

<!-- 底部 Tab 栏 -->
<div class="tab-bar">
  <button class="active" onclick="switchTab('quiz')"><span class="icon">🎯</span>抽查</button>
  <button onclick="switchTab('list')"><span class="icon">📋</span>列表</button>
  <button onclick="switchTab('upload')"><span class="icon">📤</span>上传</button>
</div>

<!-- 设置弹层 -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>设置 <button class="close" onclick="closeSettings()">✕</button></h2>
    <label>Worker URL</label>
    <input type="url" id="set-worker-url" placeholder="https://your-worker.xxx.workers.dev">
    <p class="hint-text">部署好的 Cloudflare Worker 代理地址</p>
    <label>AI 识别服务</label>
    <select id="set-provider" onchange="updateApiKeyLink()">
      <option value="qwen">通义千问 Qwen-VL</option>
      <option value="openai">OpenAI GPT-4o</option>
      <option value="doubao">豆包 Doubao</option>
      <option value="zhipu">智谱 GLM-4V</option>
    </select>
    <a id="apikey-link" class="apikey-link" href="#" target="_blank" rel="noopener">获取 API Key →</a>
    <label>API Key</label>
    <input type="password" id="set-api-key" placeholder="sk-...">
    <p class="hint-text">对应 AI 服务商的 API Key</p>
    <label>抽查天数（最近 N 天内的词）</label>
    <input type="number" id="set-days" min="1" value="7">
    <label>每组抽查数量</label>
    <input type="number" id="set-limit" min="1" value="20">
    <button class="save-btn" onclick="saveSettings()">保存设置</button>
    <div class="backup-row">
      <button onclick="exportBackup()">📥 导出备份</button>
      <button onclick="document.getElementById('import-input').click()">📤 导入备份</button>
    </div>
    <input type="file" id="import-input" accept=".json,application/json" style="display:none" onchange="importBackup(event)">
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- 抽查卡片编辑弹层 -->
<div class="confirm-overlay" id="quiz-edit-overlay">
  <div class="confirm-box" style="text-align:left;max-width:340px">
    <h2 style="font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">编辑单词 <button class="close" style="background:none;font-size:20px;color:var(--text-light);padding:4px" onclick="closeQuizEdit()">✕</button></h2>
    <div id="quiz-edit-fields"></div>
    <div class="confirm-btns" style="margin-top:18px">
      <button class="btn-no" onclick="closeQuizEdit()">取消</button>
      <button class="btn-yes" onclick="saveQuizEdit()">保存</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   多语言背单词 PWA — 纯前端 IndexedDB 架构
   支持多语言切换，数据存储在浏览器 IndexedDB，OCR 通过 CF Worker 代理
   ========================================================== */

/* ===== 语言映射 ===== */
const LANG_MAP = {
  es: '西班牙语', fr: '法语', en: '英语', de: '德语',
  ja: '日语', ko: '韩语', it: '意大利语', pt: '葡萄牙语'
};
const LANG_LIST = ['es','fr','en','de','ja','ko','it','pt'];

/* ===== 全局状态 ===== */
let db = null;
let currentLang = localStorage.getItem('currentLang') || 'es';
let quizMode = 'meaning2term';
let quizWords = [];
let quizIndex = 0;
let listView = 'all';
let listPage = 1;
let langVisible = { zh: true, en: true, term: true };
let uploadedWords = [];

/* ===== 工具函数 ===== */
function toast(msg, duration = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}
function esc(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function langName(code) { return LANG_MAP[code] || code; }

/* ===== IndexedDB 封装 ===== */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('SpanishVocabDB', 2);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      const tx = e.target.transaction;
      if (e.oldVersion < 1) {
        // 全新安装：直接创建 v2 结构
        const ws = database.createObjectStore('words', { keyPath: 'id', autoIncrement: true });
        ws.createIndex('lang', 'lang', { unique: false });
        ws.createIndex('lang_term', ['lang', 'term'], { unique: true });
        ws.createIndex('status', 'status', { unique: false });
        ws.createIndex('createdAt', 'createdAt', { unique: false });
        if (!database.objectStoreNames.contains('settings')) {
          database.createObjectStore('settings', { keyPath: 'key' });
        }
      } else if (e.oldVersion < 2) {
        // v1 → v2 迁移：遍历现有数据，添加 lang/term，删除 spanish 索引
        const ws = tx.objectStore('words');
        // 删除旧索引
        if (ws.indexNames.contains('spanish')) ws.deleteIndex('spanish');
        // 创建新索引
        ws.createIndex('lang', 'lang', { unique: false });
        ws.createIndex('lang_term', ['lang', 'term'], { unique: true });
        // 用 cursor 迁移每条记录
        const cursorReq = ws.openCursor();
        cursorReq.onsuccess = (ev) => {
          const cursor = ev.target.result;
          if (!cursor) return;
          const record = cursor.value;
          // 添加 lang 和 term 字段
          if (!record.lang) record.lang = 'es';
          if (!record.term) record.term = record.spanish || '';
          // 删除旧 spanish 字段
          delete record.spanish;
          cursor.update(record);
          cursor.continue();
        };
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

/* 通用事务辅助 */
function txStore(storeName, mode = 'readonly') {
  const tx = db.transaction(storeName, mode);
  return tx.objectStore(storeName);
}

function getAllFromStore(storeName) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getFromStore(storeName, key) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function putToStore(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.put(data);
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
  });
}

function batchPutToStore(storeName, items) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    items.forEach(item => store.put(item));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function getByIndex(storeName, indexName, value) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const idx = store.index(indexName);
    const req = idx.getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* 检查单词是否已存在（按 lang+term 唯一） */
function wordExists(lang, term) {
  return new Promise((resolve) => {
    const store = txStore('words');
    const idx = store.index('lang_term');
    const req = idx.get([lang, term]);
    req.onsuccess = () => resolve(!!req.result);
    req.onerror = () => resolve(false);
  });
}

/* ===== Settings 读写（IndexedDB + localStorage 双写）===== */
async function getSetting(key, fallback = null) {
  const cached = localStorage.getItem('setting_' + key);
  if (cached !== null) return cached;
  const row = await getFromStore('settings', key);
  return row ? row.value : fallback;
}

async function setSetting(key, value) {
  localStorage.setItem('setting_' + key, value);
  await putToStore('settings', { key, value });
}

/* ===== 数据播种 ===== */
async function seedIfEmpty() {
  const all = await getAllFromStore('words');
  if (all.length > 0) return;
  toast('首次加载，正在导入词库...');
  try {
    const res = await fetch('./seed.json');
    const words = await res.json();
    const tx = db.transaction('words', 'readwrite');
    const store = tx.objectStore('words');
    const now = new Date().toISOString();
    words.forEach(w => {
      store.add({
        lang: 'es',
        term: w.spanish || w.term || '',
        english: w.english || '',
        chinese: w.chinese || '',
        status: 'active',
        createdAt: now,
        lastReviewedAt: null
      });
    });
    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    toast(`导入完成，共 ${words.length} 个单词`);
  } catch (e) {
    toast('词库导入失败: ' + e.message);
  }
}

/* ===== 语言切换器 ===== */
function toggleLangDropdown() {
  const dd = document.getElementById('lang-dropdown');
  if (dd.classList.contains('show')) { dd.classList.remove('show'); return; }
  renderLangDropdown();
  dd.classList.add('show');
  // 点击外部关闭
  setTimeout(() => {
    const handler = (e) => {
      if (!e.target.closest('.lang-switcher')) { dd.classList.remove('show'); document.removeEventListener('click', handler); }
    };
    document.addEventListener('click', handler);
  }, 0);
}

async function renderLangDropdown() {
  const dd = document.getElementById('lang-dropdown');
  // 获取已有语言集合
  const all = await getAllFromStore('words');
  const existingLangs = [...new Set(all.map(w => w.lang).filter(Boolean))];
  // 确保 currentLang 在列表中
  if (!existingLangs.includes(currentLang)) existingLangs.push(currentLang);
  // 排序：按 LANG_LIST 顺序
  existingLangs.sort((a, b) => LANG_LIST.indexOf(a) - LANG_LIST.indexOf(b));

  let html = existingLangs.map(code =>
    `<button class="lang-option ${code === currentLang ? 'active' : ''}" onclick="switchLang('${code}')">${langName(code)}</button>`
  ).join('');
  html += '<div class="lang-divider"></div>';
  html += '<button class="lang-option" onclick="showAddLangMenu()">＋ 添加语言</button>';
  dd.innerHTML = html;
}

function showAddLangMenu() {
  const dd = document.getElementById('lang-dropdown');
  let html = LANG_LIST.map(code =>
    `<button class="lang-option" onclick="addAndSwitchLang('${code}')">${langName(code)}</button>`
  ).join('');
  html += '<div class="lang-divider"></div>';
  html += '<button class="lang-option" onclick="renderLangDropdown()">← 返回</button>';
  dd.innerHTML = html;
}

function addAndSwitchLang(code) {
  switchLang(code);
}

function switchLang(code) {
  currentLang = code;
  localStorage.setItem('currentLang', code);
  document.getElementById('lang-dropdown').classList.remove('show');
  updateUIForLang();
  // 刷新当前页面数据
  const activeSection = document.querySelector('section.active');
  if (activeSection && activeSection.id === 'sec-list') loadList();
}

function updateUIForLang() {
  const name = langName(currentLang);
  document.getElementById('lang-label').textContent = name;
  // 抽查模式按钮文案
  const modeBar = document.getElementById('quiz-mode-bar');
  const isEn = currentLang === 'en';
  if (isEn) {
    modeBar.children[0].textContent = '看英文猜中文';
    modeBar.children[1].textContent = '看中文猜英文';
  } else {
    modeBar.children[0].textContent = `看中英猜${name}`;
    modeBar.children[1].textContent = `看${name}猜中英`;
  }
  // 列表视图切换按钮
  const toggleTerm = document.getElementById('toggle-term');
  const toggleEn = document.getElementById('toggle-en');
  if (isEn) {
    toggleTerm.textContent = '英文';
    toggleEn.style.display = 'none';
  } else {
    toggleTerm.textContent = name;
    toggleEn.style.display = '';
  }
  // 手动录入 placeholder
  const termInput = document.getElementById('manual-term');
  const enInput = document.getElementById('manual-en');
  termInput.placeholder = `${name}单词（必填）`;
  if (isEn) {
    enInput.style.display = 'none';
  } else {
    enInput.style.display = '';
    enInput.placeholder = '英文（选填）';
  }
}

/* ===== 应用初始化 ===== */
async function initApp() {
  try {
    db = await openDB();
    await seedIfEmpty();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if (!window.matchMedia('(display-mode: standalone)').matches) {
      document.getElementById('pwa-banner').classList.add('show');
    }
    updateUIForLang();
    updateOCRButtonState();
  } catch (e) {
    toast('数据库初始化失败: ' + e.message);
  }
}

/* OCR 按钮灰态控制 */
async function updateOCRButtonState() {
  const workerUrl = await getSetting('workerUrl', '');
  const apiKey = await getSetting('apiKey', '');
  const box = document.getElementById('ocr-box');
  if (!workerUrl || !apiKey) {
    box.classList.add('disabled');
    box.querySelector('p').textContent = '请先在设置中配置 Worker URL 和 API Key';
  } else {
    box.classList.remove('disabled');
    box.querySelector('p').textContent = '选择图片 / 拍照';
  }
}

function triggerOCR() {
  const box = document.getElementById('ocr-box');
  if (box.classList.contains('disabled')) { toast('请先在设置中配置 Worker URL 和 API Key'); return; }
  document.getElementById('file-input').click();
}

/* ===== Tab 切换 ===== */
function switchTab(name) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  document.querySelectorAll('.tab-bar button').forEach((b, i) => {
    b.classList.toggle('active', ['quiz','list','upload'][i] === name);
  });
  if (name === 'list') loadList();
}

/* ===== 页面1：单词抽查（加权随机）===== */
function setQuizMode(mode) {
  quizMode = mode;
  document.querySelectorAll('#quiz-mode-bar button').forEach((b, i) => {
    b.classList.toggle('active', (mode === 'meaning2term' && i === 0) || (mode === 'term2meaning' && i === 1));
  });
  if (quizWords.length > 0 && quizIndex < quizWords.length) showQuizCard();
}

async function startQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '<div class="spinner show">⏳ 加载中...</div>';
  try {
    const quizDays = parseInt(await getSetting('quizDays', '7'));
    const quizLimit = parseInt(await getSetting('quizLimit', '20'));
    // 只查当前语言的词
    const allWords = await getByIndex('words', 'lang', currentLang);
    if (allWords.length === 0) {
      body.innerHTML = '<div class="done-msg">暂无可抽查的单词</div>';
      return;
    }
    const eligible = allWords.filter(w => w.status !== 'killed');
    if (eligible.length === 0) {
      body.innerHTML = '<div class="done-msg">暂无可抽查的单词<br><span style="font-size:13px;color:var(--text-light)">所有单词已被"斩"，可在列表中"捞回"或添加新词</span></div>';
      return;
    }
    const now = Date.now();
    const dayMs = quizDays * 86400000;
    const weighted = eligible.map(w => {
      let weight = 1;
      const lastReview = w.lastReviewedAt ? new Date(w.lastReviewedAt).getTime() : 0;
      if (!lastReview) weight = 4;
      else if (now - lastReview > dayMs) weight = 3;
      else if (w.status === 'favorite') weight = 2;
      return { word: w, weight };
    });
    quizWords = weightedSample(weighted, Math.min(quizLimit, eligible.length));
    if (quizWords.length === 0) { body.innerHTML = '<div class="done-msg">暂无可抽查的单词</div>'; return; }
    quizIndex = 0;
    showQuizCard();
  } catch (e) {
    body.innerHTML = '<button class="start-btn" onclick="startQuiz()">开始抽查</button>';
  }
}

function weightedSample(items, count) {
  const pool = [...items];
  const result = [];
  for (let i = 0; i < count && pool.length > 0; i++) {
    const totalWeight = pool.reduce((sum, it) => sum + it.weight, 0);
    let rand = Math.random() * totalWeight;
    let chosen = 0;
    for (let j = 0; j < pool.length; j++) {
      rand -= pool[j].weight;
      if (rand <= 0) { chosen = j; break; }
    }
    result.push(pool[chosen].word);
    pool.splice(chosen, 1);
  }
  return result;
}

function showQuizCard() {
  const body = document.getElementById('quiz-body');
  if (quizIndex >= quizWords.length) {
    body.innerHTML = '<div class="done-msg">🎉 本组完成！<br><button class="start-btn" onclick="startQuiz()">再抽一组</button></div>';
    return;
  }
  const w = quizWords[quizIndex];
  const isEn = currentLang === 'en';
  let question, hint, answer;
  if (quizMode === 'term2meaning') {
    // 目标词 → 释义
    question = w.term;
    hint = '';
    answer = isEn ? w.chinese : `${w.chinese}　${w.english || ''}`;
  } else {
    // 释义 → 目标词
    if (isEn) {
      question = w.chinese;
      hint = '';
    } else {
      question = w.chinese;
      hint = w.english || '';
    }
    answer = w.term;
  }
  body.innerHTML = `
    <div class="quiz-card">
      <button class="quiz-edit-btn" title="编辑当前词" onclick="openQuizEdit()">✎</button>
      <div class="question">${esc(question)}</div>
      ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      <div class="answer" id="answer-text">${esc(answer)}</div>
    </div>
    <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">点击揭晓答案</button>
    <div class="action-row" id="action-row" style="display:none">
      <button class="btn-remember" onclick="quizAction('remember')">✓ 记得</button>
      <button class="btn-favorite" onclick="quizAction('favorite')">★ 不记得</button>
      <button class="btn-kill" onclick="quizAction('kill')">✗ 斩</button>
    </div>
  `;
}

function revealAnswer() {
  document.getElementById('answer-text').classList.add('show');
  document.getElementById('reveal-btn').style.display = 'none';
  document.getElementById('action-row').style.display = 'flex';
}

async function quizAction(action) {
  const w = quizWords[quizIndex];
  const now = new Date().toISOString();
  if (action === 'favorite') w.status = 'favorite';
  else if (action === 'kill') {
    w.status = 'killed';
    playSlashSound();
    // 从当前组中移除已斩的词，避免后续重复出现
    quizWords.splice(quizIndex, 1);
    w.lastReviewedAt = now;
    await putToStore('words', w);
    showQuizCard();
    return;
  }
  w.lastReviewedAt = now;
  await putToStore('words', w);
  quizIndex++;
  showQuizCard();
}

/* ===== 页面2：单词列表 ===== */
function setListView(view) {
  listView = view;
  listPage = 1;
  document.querySelectorAll('.sub-tabs button').forEach((b, i) => {
    b.classList.toggle('active', ['all','favorites','killed'][i] === view);
  });
  loadList();
}

function toggleLangCol(col) {
  const nextState = !langVisible[col];
  const visibleCount = Object.entries(langVisible).filter(([k,v]) => {
    if (currentLang === 'en' && k === 'en') return false; // en列隐藏时不计
    return k === col ? nextState : v;
  }).length;
  if (visibleCount === 0) { toast('至少保留一列可见'); return; }
  langVisible[col] = nextState;
  updateLangToggles();
  applyViewFilter();
}

function updateLangToggles() {
  ['zh','en','term'].forEach(col => {
    const btn = document.getElementById('toggle-' + col);
    if (!btn) return;
    if (langVisible[col]) { btn.classList.add('active'); btn.classList.remove('inactive'); }
    else { btn.classList.remove('active'); btn.classList.add('inactive'); }
  });
}

function applyViewFilter() {
  document.querySelectorAll('#list-body .word-item').forEach(item => {
    item.querySelectorAll('.col-zh').forEach(el => {
      el.classList.toggle('masked', !langVisible.zh);
      if (langVisible.zh) el.classList.remove('revealed');
    });
    item.querySelectorAll('.col-en').forEach(el => {
      el.classList.toggle('masked', !langVisible.en);
      if (langVisible.en) el.classList.remove('revealed');
    });
    item.querySelectorAll('.col-term').forEach(el => {
      el.classList.toggle('masked', !langVisible.term);
      if (langVisible.term) el.classList.remove('revealed');
    });
  });
}

async function loadList() {
  const body = document.getElementById('list-body');
  body.innerHTML = '<div class="spinner show">加载中...</div>';
  try {
    // 只查当前语言
    let allWords = await getByIndex('words', 'lang', currentLang);
    if (listView === 'all') allWords = allWords.filter(w => w.status !== 'killed');
    else if (listView === 'favorites') allWords = allWords.filter(w => w.status === 'favorite');
    else if (listView === 'killed') allWords = allWords.filter(w => w.status === 'killed');
    allWords.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const pageSize = 50;
    const total = allWords.length;
    const totalPages = Math.ceil(total / pageSize);
    const start = (listPage - 1) * pageSize;
    const pageWords = allWords.slice(start, start + pageSize);
    if (pageWords.length === 0) {
      body.innerHTML = '<div class="done-msg">暂无数据</div>';
      document.getElementById('list-pagination').innerHTML = '';
      return;
    }
    const isEn = currentLang === 'en';
    body.innerHTML = pageWords.map(w => renderWordItem(w, isEn)).join('');
    updateLangToggles();
    applyViewFilter();
    const pag = document.getElementById('list-pagination');
    if (totalPages > 1) {
      pag.innerHTML = `
        <button ${listPage <= 1 ? 'disabled' : ''} onclick="listPage--;loadList()">上一页</button>
        <span>${listPage} / ${totalPages}</span>
        <button ${listPage >= totalPages ? 'disabled' : ''} onclick="listPage++;loadList()">下一页</button>
      `;
    } else { pag.innerHTML = ''; }
  } catch(e) { body.innerHTML = '<div class="done-msg">加载失败</div>'; }
}

function renderWordItem(w, isEn) {
  const zhClass = !langVisible.zh ? 'masked' : '';
  const enClass = !langVisible.en ? 'masked' : '';
  const termClass = !langVisible.term ? 'masked' : '';
  // 学英语时隐藏 english 列（term 就是英文）
  const enCol = isEn ? '' : `<span class="col-en ${enClass}" onclick="toggleMask(this)">${esc(w.english || '')}</span>`;
  let actions;
  if (listView === 'killed') {
    // 已斩视图：“取消斩/捞回” + 编辑
    actions = `
      <button class="icon-btn restore" title="取消斩/捞回" onclick="event.stopPropagation();updateWordStatus(${w.id},'active',this.closest('.word-item'))">↩ 捞回</button>
      <button class="icon-btn edit" title="编辑" onclick="event.stopPropagation();startEditRow(${w.id},this.closest('.word-item'))">✎</button>`;
  } else {
    // 全部/收藏夹视图：★收藏 + ✗斩 + ✎编辑
    const favOn = w.status === 'favorite' ? 'on' : '';
    actions = `
      <button class="icon-btn fav ${favOn}" title="收藏" onclick="event.stopPropagation();updateWordStatus(${w.id},'favorite',this.closest('.word-item'))">★</button>
      <button class="icon-btn kill" title="斩" onclick="event.stopPropagation();updateWordStatus(${w.id},'killed',this.closest('.word-item'))">✗</button>
      <button class="icon-btn edit" title="编辑" onclick="event.stopPropagation();startEditRow(${w.id},this.closest('.word-item'))">✎</button>`;
  }
  return `<div class="word-item" data-id="${w.id}">
    <span class="col-zh ${zhClass}" onclick="toggleMask(this)">${esc(w.chinese)}</span>
    ${enCol}
    <span class="col-term ${termClass}" onclick="toggleMask(this)">${esc(w.term)}</span>
    <span class="actions">${actions}</span>
  </div>`;
}

function toggleMask(el) {
  if (el.classList.contains('masked')) el.classList.toggle('revealed');
}

/* 通用：根据 id 修改 status（收藏/斩/捞回），并按当前视图决定移除或刷新行 */
async function updateWordStatus(id, newStatus, rowEl) {
  try {
    const word = await getFromStore('words', id);
    if (!word) return;
    // ★ 收藏切换：若已是 favorite 再点则切回 active
    if (newStatus === 'favorite' && word.status === 'favorite') newStatus = 'active';
    word.status = newStatus;
    if (newStatus === 'favorite') word.lastReviewedAt = new Date().toISOString();
    await putToStore('words', word);
    if (newStatus === 'killed') playSlashSound();
    const MSG = { favorite: '已收藏 ★', active: '已恢复', killed: '已斩 ✗' };
    toast(MSG[newStatus] || '已更新');
    // 当前视图是否仍应显示该行：all 含 killed → 总保留；favorites/killed 按新状态判断
    const stillVisible = listView === 'all' ? newStatus !== 'killed'
      : listView === 'favorites' ? newStatus === 'favorite'
      : listView === 'killed' ? newStatus === 'killed' : true;
    if (rowEl) {
      if (!stillVisible) {
        rowEl.remove();
        if (!document.querySelector('#list-body .word-item')) loadList();
      } else {
        replaceWordRow(rowEl, word);
      }
    }
  } catch (e) { toast('操作失败: ' + e.message); }
}

/* 用最新记录重渲某一行（保留当前显隐状态） */
function replaceWordRow(rowEl, word) {
  const isEn = currentLang === 'en';
  const tmp = document.createElement('div');
  tmp.innerHTML = renderWordItem(word, isEn);
  const newRow = tmp.firstElementChild;
  rowEl.replaceWith(newRow);
  applyViewFilter();
}

/* 按 lang+term 取单条记录（用于编辑防重） */
function getWordByLangTerm(lang, term) {
  return new Promise((resolve) => {
    try {
      const store = txStore('words');
      const idx = store.index('lang_term');
      const req = idx.get([lang, term]);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

/* 保存行内编辑 */
async function saveEditRow(id, btn) {
  const rowEl = btn.closest('.word-item');
  const data = {};
  rowEl.querySelectorAll('.edit-inp').forEach(i => { data[i.dataset.f] = i.value.trim(); });
  const term = data.term;
  if (!term) { toast('目标词不能为空'); return; }
  const word = await getFromStore('words', id);
  if (!word) return;
  // 基本防重：term 变化且与其它记录 (lang,term) 冲突
  if (term !== word.term) {
    const dup = await getWordByLangTerm(currentLang, term);
    if (dup && dup.id !== id) { toast('该词已存在，未保存'); return; }
  }
  word.term = term;
  word.chinese = data.chinese || '';
  word.english = (currentLang === 'en') ? term : (data.english || '');
  try {
    await putToStore('words', word);
    toast('已保存');
    replaceWordRow(rowEl, word);
  } catch (e) { toast('保存失败: ' + e.message); }
}

/* CSV 上传 */
function handleCSVUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') { toast('xlsx 格式暂不支持，请导出为 CSV 格式'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const newWords = [];
    for (const line of lines) {
      let cols = line.includes('\t') ? line.split('\t') : line.split(',');
      cols = cols.map(c => c.trim().replace(/^["']|["']$/g, ''));
      if (cols[0]) newWords.push({ term: cols[0] || '', english: cols[1] || '', chinese: cols[2] || '' });
    }
    if (newWords.length === 0) { toast('未识别到数据'); return; }
    uploadedWords = uploadedWords.concat(newWords);
    renderEditTable(uploadedWords);
    toast(`识别到 ${newWords.length} 条数据`);
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* 图片 OCR：Canvas 压缩 → base64 → CF Worker */
async function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const workerUrl = await getSetting('workerUrl', '');
  const provider = await getSetting('provider', 'qwen');
  const apiKey = await getSetting('apiKey', '');
  if (!workerUrl || !apiKey) { toast('请先在设置中配置 Worker URL 和 API Key'); event.target.value = ''; return; }
  const spinner = document.getElementById('upload-spinner');
  spinner.classList.add('show');
  document.getElementById('upload-result').innerHTML = '';
  try {
    const base64 = await compressAndEncode(file, 1260, 0.6);
    const MODEL_MAP = { qwen: 'qwen-vl-max', openai: 'gpt-4o', doubao: 'doubao-1-5-vision-pro-32k', zhipu: 'glm-4v' };
    const model = MODEL_MAP[provider] || 'qwen-vl-max';
    const lname = langName(currentLang);
    const body = {
      model,
      messages: [
        { role: 'system', content: '你是一名外语单词卡片提取助手。只提取学习词汇，忽略UI按钮、导航栏、菜单等非学习内容文字。' },
        { role: 'user', content: [
          { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64}` } },
          { type: 'text', text: `请识别这张${lname}学习截图中所有的${lname}单词及其英文、中文翻译。输出必须是纯JSON数组（不要用markdown代码块包裹），格式：[{"term":"${lname}原词","english":"英文释义","chinese":"中文释义"}]。忽略界面按钮、导航栏、菜单等非学习内容。若图中无可识别单词，返回空数组[]。` }
        ]}
      ]
    };
    const res = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'x-provider': provider },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`OCR 请求失败 (${res.status})`);
    const data = await res.json();
    let words = [];
    if (Array.isArray(data)) { words = data; }
    else if (data.choices && data.choices[0]) {
      let content = data.choices[0].message?.content || '';
      const match = content.match(/\[[\s\S]*\]/);
      if (match) words = JSON.parse(match[0]);
    } else if (data.words) { words = data.words; }
    // 兼容：如果返回里有 spanish 没有 term，映射过来
    words = words.map(w => {
      if (!w.term && w.spanish) w.term = w.spanish;
      delete w.spanish;
      return w;
    });
    spinner.classList.remove('show');
    if (words.length > 0) {
      uploadedWords = uploadedWords.concat(words);
      renderEditTable(uploadedWords);
      toast(`识别到 ${words.length} 个单词`);
    } else { toast('未识别到单词'); }
  } catch (e) { spinner.classList.remove('show'); toast('OCR 识别失败: ' + e.message); }
  event.target.value = '';
}

function compressAndEncode(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = URL.createObjectURL(file);
  });
}

/* 可编辑表格 */
function renderEditTable(words) {
  uploadedWords = words;
  const result = document.getElementById('upload-result');
  if (words.length === 0) { result.innerHTML = ''; return; }
  const lname = langName(currentLang);
  const isEn = currentLang === 'en';
  let rows = words.map((w, i) => {
    const enCell = isEn ? '' : `<td><input value="${esc(w.english)}" data-i="${i}" data-f="english"></td>`;
    return `<tr>
      <td><input value="${esc(w.term)}" data-i="${i}" data-f="term"></td>
      ${enCell}
      <td><input value="${esc(w.chinese)}" data-i="${i}" data-f="chinese"></td>
      <td><button class="del-btn" onclick="delUploadRow(${i})">✕</button></td>
    </tr>`;
  }).join('');
  const enHeader = isEn ? '' : '<th>英文</th>';
  result.innerHTML = `
    <table class="edit-table">
      <tr><th>${lname}</th>${enHeader}<th>中文</th><th></th></tr>
      ${rows}
    </table>
    <button class="batch-btn" onclick="batchSave()">确认入库（${words.length} 条）</button>
  `;
  result.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => { uploadedWords[inp.dataset.i][inp.dataset.f] = inp.value; });
  });
}

function delUploadRow(index) {
  uploadedWords.splice(index, 1);
  renderEditTable(uploadedWords);
}

/* 批量入库到 IndexedDB */
async function batchSave() {
  if (uploadedWords.length === 0) { toast('无数据'); return; }
  let inserted = 0, skipped = 0;
  const now = new Date().toISOString();
  try {
    for (const w of uploadedWords) {
      const term = (w.term || '').trim();
      if (!term) { skipped++; continue; }
      const exists = await wordExists(currentLang, term);
      if (exists) { skipped++; continue; }
      await putToStore('words', {
        lang: currentLang,
        term,
        english: (w.english || '').trim(),
        chinese: (w.chinese || '').trim(),
        status: 'active',
        createdAt: now,
        lastReviewedAt: null
      });
      inserted++;
    }
    toast(`入库成功：新增 ${inserted}，跳过 ${skipped}`);
    uploadedWords = [];
    document.getElementById('upload-result').innerHTML = '';
  } catch (e) { toast('入库失败: ' + e.message); }
}

/* 导出数据：全语言全量 → v2 紧凑 JSON */
async function exportBackup() {
  try {
    const all = await getAllFromStore('words');
    const words = all.map(w => {
      const o = { lang: w.lang || 'es', term: w.term };
      if (w.english && w.english.trim()) o.english = w.english;
      if (w.chinese && w.chinese.trim()) o.chinese = w.chinese;
      if (w.status && w.status !== 'active') o.status = w.status;
      if (w.lastReviewedAt) o.lastReviewedAt = w.lastReviewedAt;
      return o;
    });
    const data = { v: 2, t: new Date().toISOString(), words };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
    a.href = url; a.download = `单词备份_${dateStr}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`导出成功，共 ${words.length} 个单词`);
  } catch(e) { toast('导出失败: ' + e.message); }
}

/* 导入更新：兼容 v2(lang+term) / v1(spanish) / 纯数组旧格式 */
async function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    let importWords;
    if (parsed && parsed.v && Array.isArray(parsed.words)) importWords = parsed.words;
    else if (Array.isArray(parsed)) importWords = parsed;
    else throw new Error('无法识别的 JSON 格式');
    // 标准化每条记录
    importWords = importWords.map(w => {
      if (!w.term && w.spanish) { w.term = w.spanish; delete w.spanish; }
      if (!w.lang) w.lang = 'es';
      return w;
    }).filter(w => w && w.term && w.term.trim());
    if (importWords.length === 0) { toast('文件中无有效单词数据'); event.target.value = ''; return; }
    // 本地建 (lang+term) map
    const localWords = await getAllFromStore('words');
    const localMap = new Map();
    localWords.forEach(w => localMap.set(`${w.lang}|${(w.term||'').trim().toLowerCase()}`, w));
    const now = new Date().toISOString();
    let added = 0, updated = 0, unchanged = 0;
    for (const iw of importWords) {
      const term = iw.term.trim();
      const lang = iw.lang || 'es';
      const key = `${lang}|${term.toLowerCase()}`;
      const local = localMap.get(key);
      if (!local) {
        await putToStore('words', {
          lang,
          term,
          english: (iw.english || '').trim(),
          chinese: (iw.chinese || '').trim(),
          status: iw.status || 'active',
          createdAt: iw.createdAt || now,
          lastReviewedAt: iw.lastReviewedAt || null
        });
        added++;
        continue;
      }
      let changed = false;
      const impTime = iw.lastReviewedAt ? new Date(iw.lastReviewedAt).getTime() : -1;
      const locTime = local.lastReviewedAt ? new Date(local.lastReviewedAt).getTime() : -1;
      if (impTime > locTime) {
        if (iw.status && iw.status !== local.status) local.status = iw.status;
        local.lastReviewedAt = iw.lastReviewedAt;
        changed = true;
      }
      if ((!local.english || !local.english.trim()) && iw.english && iw.english.trim()) { local.english = iw.english.trim(); changed = true; }
      if ((!local.chinese || !local.chinese.trim()) && iw.chinese && iw.chinese.trim()) { local.chinese = iw.chinese.trim(); changed = true; }
      if (changed) { await putToStore('words', local); updated++; } else { unchanged++; }
    }
    toast(`新增 ${added} 个，更新 ${updated} 个，未变 ${unchanged} 个`, 3000);
    if (document.getElementById('sec-list').classList.contains('active')) loadList();
  } catch(e) { toast('导入失败：' + e.message); }
  event.target.value = '';
}

/* ===== 斩音效（Web Audio API 合成） ===== */
function playSlashSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.18);
    osc.onended = () => ctx.close();
  } catch(e) { /* 静默失败 */ }
}
