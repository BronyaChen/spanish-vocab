services:
  - type: web
    name: spanish-vocab
    runtime: python
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spanish-vocab-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: spanish-vocab-db
    plan: free
    databaseName: spanish_vocab
